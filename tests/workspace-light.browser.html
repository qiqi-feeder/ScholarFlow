<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ScholarFlow isolated browser checks</title></head>
<body data-result="pending" style="margin:0"><pre id="result">Pending</pre><iframe id="demo" title="Demo under test" style="border:0;display:block"></iframe>
<script>
'use strict';
const params = new URLSearchParams(location.search), width = Number(params.get('width') || 1440), height = Number(params.get('height') || 900);
const frame = document.getElementById('demo');frame.width=width;frame.height=height;
const failures=[],errors=[];
function assert(value,message){if(!value)failures.push(message);}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
frame.addEventListener('load',async()=>{
  try {
    const w=frame.contentWindow,d=frame.contentDocument,$=s=>d.querySelector(s),$$=s=>[...d.querySelectorAll(s)];
    w.addEventListener('error',e=>errors.push(e.message));
    await d.fonts.ready;
    assert(Boolean(w.scholarflowDemo),'Script initialized');
    if(!w.scholarflowDemo)throw new Error('Missing demo API');
    const state=()=>w.scholarflowDemo.getState();
    const key=(target,value,extra={})=>target.dispatchEvent(new w.KeyboardEvent('keydown',{key:value,bubbles:true,cancelable:true,...extra}));
    function containment(label){
      assert(d.documentElement.scrollWidth<=width+1,label+': no body horizontal overflow');
      assert($('.app').getBoundingClientRect().height===height,label+': bounded workbench height');
      assert($('.view-stage').scrollWidth<=$('.view-stage').clientWidth+1,label+': content remains inside editor');
    }
    const initial=params.get('view')||'overview';
    assert(state().view===(['overview','sources','reading','notes','evidence','experiments'].includes(initial)?initial:'overview'),'Initial view query or safe fallback');
    w.scholarflowDemo.openView('overview');
    w.scholarflowDemo.openView('toString');assert(state().view==='overview','Inherited object keys cannot open a view');
    assert($$('.workspace-view').length===6,'Six preserved views');
    assert(!$('.overview .overview-hero, .overview .stat-card'),'No dashboard collage');
    assert(d.fonts.check('13px Geist'),'Self-hosted Geist loaded');containment('Overview');
    const tokens=w.getComputedStyle(d.documentElement);
    const luminance=hex=>{const c=hex.replace('#','').match(/../g).map(x=>parseInt(x,16)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);return c[0]*.2126+c[1]*.7152+c[2]*.0722;};
    for(const [front,back] of [['--ink','--surface'],['--muted','--chrome'],['--muted','--sidebar'],['--accent','--accent-soft'],['--success','--success-soft'],['--surface','--accent']]){
      const a=luminance(tokens.getPropertyValue(front).trim()),b=luminance(tokens.getPropertyValue(back).trim());
      assert((Math.max(a,b)+.05)/(Math.min(a,b)+.05)>=4.5,'WCAG AA token contrast: '+front+' on '+back);
    }
    for(const view of ['sources','reading','notes','evidence','experiments']){
      $('.activity-button[data-open-view="'+view+'"]').click();assert(state().view===view,'Navigate '+view);containment(view);
      if(view==='notes'){
        assert(w.getComputedStyle($('.notes-layout')).display==='grid','Notes use deliberate grid layout');
        if(width>760)assert($('.note-card').getBoundingClientRect().bottom<=$$('.note-card')[1].getBoundingClientRect().top+1,'Note cards are stacked, not inline');
      }
      if(view==='experiments'){
        assert(w.getComputedStyle($('.metric-row')).display==='grid','Experiment metrics remain horizontal');
        assert($('.chart').getBoundingClientRect().height===144&&$('.bar').getBoundingClientRect().height>50,'Experiment comparison chart rendered');
      }
    }
    assert(state().tabs.length===6,'Views open their own tabs');
    $('.tab-close[data-close-tab="experiments"]').click();assert(state().tabs.length===5&&state().view!=='experiments','Close active tab fallback');
    for(const tab of [...state().tabs])w.scholarflowDemo.closeTab(tab.view);
    assert(Boolean($('#emptyEditor'))&&state().view===null,'Close all tabs empty state');
    $('#emptyEditor button').click();assert(state().view==='overview','Reopen empty editor');
    w.scholarflowDemo.openView('reading');$('.editor-tab[aria-selected="true"]').focus();key(d.activeElement,'ArrowLeft');
    assert(state().view==='overview'&&d.activeElement.getAttribute('aria-selected')==='true','Accessible arrow-key tabs');
    key(d,'k',{ctrlKey:true});assert($('#commandOverlay').open,'Ctrl K opens native modal');
    $('#commandInput').value='evidence';$('#commandInput').dispatchEvent(new w.Event('input',{bubbles:true}));
    assert($$('.command-result:not([hidden])').length===1,'Command filtering');key($('#commandInput'),'Enter');
    assert(state().view==='evidence'&&!$('#commandOverlay').open,'Enter opens filtered command');
    $('#globalSearch').click();key(d,'Escape');assert(!$('#commandOverlay').open,'Escape closes palette');
    $('#globalSearch').click();$('#commandInput').value='not-a-command';$('#commandInput').dispatchEvent(new w.Event('input'));
    assert(!$('#commandEmpty').hidden,'Empty command state');key(d,'Escape');
    $('#projectSwitcher').click();assert(!$('#projectMenu').hidden,'Project menu opens');key(d,'Escape');assert($('#projectMenu').hidden,'Escape resets project menu');
    $('#projectSwitcher').click();$('.project-option[data-project="llm"]').click();assert(state().project==='llm'&&$('#overviewTitle').textContent==='高效大模型推理','Project switch');
    assert($('[data-stat="papers"]').textContent==='17','Project context updates');
    $('#projectSwitcher').click();$('.project-option[data-project="medical"]').click();
    w.scholarflowDemo.openView('sources');$('#paperFilter').value='HeMIS';$('#paperFilter').dispatchEvent(new w.Event('input'));
    assert($$('#paperTable tr:not([hidden])').length===1,'Paper filter matches');$('#paperFilter').value='no-such-paper';$('#paperFilter').dispatchEvent(new w.Event('input'));
    assert($$('#paperTable tr:not([hidden])').length===0&&!$('#paperFilterEmpty').hidden,'Paper empty state');
    $('#paperFilter').value='';$('#paperFilter').dispatchEvent(new w.Event('input'));assert($$('#paperTable tr:not([hidden])').length===5,'Reset paper filter');
    $('#paperTable .paper-link').click();assert(state().view==='reading','Keyboard-accessible paper button opens reading');
    $('.context-chip .remove').click();assert($('#contextCount').textContent==='2 个来源','Remove context');$('#addContext').click();$('#addContext').click();assert($$('.context-chip').length===3,'Add context once');
    const before=$$('.message').length;$('#agentInput').value='分析实验';key($('#agentInput'),'Enter',{isComposing:true});assert($$('.message').length===before,'IME composition Enter does not send');
    key($('#agentInput'),'Enter',{shiftKey:true});assert($$('.message').length===before,'Shift Enter does not send');
    key($('#agentInput'),'Enter');assert($$('.message').length===before+2,'Enter submits Agent prompt');await wait(700);
    assert($('.message:last-child').textContent.includes('Mock 分析完成'),'Asynchronous mock response');
    const attack='<img src=x onerror="window.__unsafe=1">';$('#agentInput').value=attack;$('#agentForm').requestSubmit();
    assert(!$('.message.user:last-of-type img')&&!$$('.message.user').at(-1).querySelector('img')&&$$('.message.user').at(-1).textContent.includes(attack),'User prompt is escaped');
    $('#newConversation').click();await wait(700);assert($$('.message').length===0&&!w.__unsafe,'New conversation cancels pending output');
    w.scholarflowDemo.openView('experiments');$('#runExperiment').click();assert($('#runExperiment').disabled,'Experiment prevents duplicate run');await wait(2300);
    assert(!$('#runExperiment').disabled&&$('#experimentConsole').textContent.includes('run-007 完成'),'Experiment output completes');
    $('#outputToggle').click();assert(d.body.classList.contains('output-hidden')&&$('#outputToggle').getAttribute('aria-expanded')==='false','Collapse output');$('#outputToggle').click();
    $('.output-tab[data-output="issues"]').click();assert($('#outputContent').textContent.includes('当前没有问题'),'Output tabs switch');
    if(width<=1100){
      $('.agent-toggle').click();assert(w.getComputedStyle($('#agentPanel')).display==='flex','Agent discoverable on compact screen');
      const r=$('#agentPanel').getBoundingClientRect();assert(r.left>=0&&r.right<=width+1&&r.bottom<=height,'Agent drawer fits');key(d,'Escape');assert(!d.body.classList.contains('agent-open'),'Dismiss Agent drawer');
    }
    if(width<=760){$('.explorer-toggle').click();assert(w.getComputedStyle($('#projectExplorer')).display==='flex','Resource drawer discoverable');$('#drawerScrim').click();assert(!d.body.classList.contains('explorer-open'),'Scrim closes resource drawer');}
    w.scholarflowDemo.openView('overview');containment('Final');assert(errors.length===0,'No runtime errors: '+errors.join('; '));
  }catch(error){failures.push(error.stack||String(error));}
  document.body.dataset.result=failures.length?'failed':'passed';
  document.getElementById('result').textContent=JSON.stringify({width,height,passed:failures.length===0,failures});
});
frame.src='../demo/workspace-light.html?view='+encodeURIComponent(params.get('view')||'overview');
</script></body></html>
